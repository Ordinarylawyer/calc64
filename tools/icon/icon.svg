<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Calc64 のアイコン：一切れを分けている円グラフのキャラクター（負担割合）。「64」は民訴法64条 -->
  <rect width="512" height="512" rx="104" fill="#E3F2FF"/>
  <ellipse cx="262" cy="468" rx="170" ry="20" fill="#BFD9EE"/>
  <!-- 腕（看板を持ち上げる） -->
  <g fill="none" stroke="#5A3D2B" stroke-width="12" stroke-linecap="round">
    <path d="M118 250 Q96 200 146 150"/>
    <path d="M394 250 Q416 200 366 150"/>
  </g>
  <!-- 体（円グラフ） -->
  <g stroke="#5A3D2B" stroke-width="12" stroke-linejoin="round">
    <path d="M256 306 L308.0 448.8 A152 152 0 1 1 402.8 345.3 Z" fill="#FFD27A"/>
    <path d="M256 306 L308.0 448.8 A152 152 0 0 1 124.4 382.0 Z" fill="#F5B451"/>
    <!-- 分けている一切れ -->
    <path d="M275.2 323.6 L422.0 362.9 A152 152 0 0 1 327.2 466.4 Z" fill="#F4845F"/>
  </g>
  <!-- 顔 -->
  <circle cx="212" cy="244" r="12" fill="#3B2A1E"/>
  <circle cx="300" cy="244" r="12" fill="#3B2A1E"/>
  <ellipse cx="180" cy="272" rx="20" ry="10" fill="#F59AB0" opacity="0.85"/>
  <ellipse cx="332" cy="272" rx="20" ry="10" fill="#F59AB0" opacity="0.85"/>
  <path d="M234 266 Q256 290 278 266" fill="none" stroke="#3B2A1E" stroke-width="7" stroke-linecap="round"/>
  <!-- 看板 -->
  <rect x="132" y="62" width="248" height="78" rx="16" fill="#FFFFFF" stroke="#5A3D2B" stroke-width="10"/>
  <text x="256" y="119" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="48" fill="#3B2A1E">負担割合</text>
  <circle cx="146" cy="146" r="18" fill="#FFD27A" stroke="#5A3D2B" stroke-width="10"/>
  <circle cx="366" cy="146" r="18" fill="#FFD27A" stroke="#5A3D2B" stroke-width="10"/>
  <!-- きらきら -->
  <g fill="#FFC83D" stroke="#5A3D2B" stroke-width="6" stroke-linejoin="round">
    <path d="M440 168 l10 24 l24 10 l-24 10 l-10 24 l-10 -24 l-24 -10 l24 -10 z"/>
    <path d="M58 300 l7 16 l16 7 l-16 7 l-7 16 l-7 -16 l-16 -7 l16 -7 z"/>
  </g>
  <!-- 64 のバッジ -->
  <circle cx="446" cy="430" r="40" fill="#5FB4F0" stroke="#2F7FBF" stroke-width="8"/>
  <text x="446" y="446" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">64</text>
</svg>
